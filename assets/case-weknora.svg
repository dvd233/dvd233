    <path d="M65 60v49 M18 84.5h94" stroke="#365357"/>
    <g fill="#24463e" stroke="#a4eccb" stroke-width="1.3">
      <rect class="input-cell" opacity="0" style="--phase:0s" x="19" y="61" width="45" height="23" rx="2"/>
      <rect class="input-cell" opacity="0" style="--phase:.14s" x="66" y="61" width="45" height="23" rx="2"/>
      <rect class="input-cell" opacity="0" style="--phase:.28s" x="19" y="85.5" width="45" height="22.5" rx="2"/>
      <rect class="input-cell" opacity="0" style="--phase:.42s" x="66" y="85.5" width="45" height="22.5" rx="2"/>
    </g>
    <g class="val" fill="#dbebe5" text-anchor="middle">
      <text x="41.5" y="77.5">124</text><text x="88.5" y="77.5">237</text>
      <text x="41.5" y="102">68</text><text x="88.5" y="102">91</text>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
