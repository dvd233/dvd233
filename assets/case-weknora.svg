<svg xmlns="http://www.w3.org/2000/svg" id="motion" width="280" height="208" viewBox="-3 0 280 208" role="img" aria-labelledby="title desc">
  <title id="title">Tencent/WeKnora #3228</title>
  <desc id="desc">A PDF Quantity field contains four standalone values: 124, 237, 68 and 91. The parser retains all four after cleanup. Layout helps identify removable page numbers and chart labels. Merged PR 3228. The star count belongs to the upstream repository.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .micro, .val, .ticket, .stars { font-family: ui-monospace, Consolas, 'Liberation Mono', monospace; }
    .micro { font-size: 11.5px; }
    .val { font-size: 15px; font-variant-numeric: tabular-nums; }
    .ticket { font-size: 13px; }
    .stars { font-size: 12px; font-weight: 600; }
    .trace, .signal { opacity: 0; }
    #motion:target .trace { stroke-dasharray: 9 40; animation: transfer 6s ease-out infinite; }
    #motion:target .signal { animation: confirm 6s ease-out var(--phase) infinite; }
    #motion:target .input-cell { animation: select-cell 6s ease-out var(--phase) infinite; }
    @keyframes select-cell {
      0%, 9%, 37%, 100% { opacity: 0; }
      16%, 26% { opacity: .85; }
    }
    @keyframes transfer {
      0%, 8% { opacity: 0; stroke-dashoffset: 9; }
      13% { opacity: 1; }
      26%, 100% { opacity: 0; stroke-dashoffset: -32; }
    }
    @keyframes confirm {
      0%, 20%, 52%, 100% { opacity: 0; }
      28%, 34% { opacity: .75; }
    }
  </style>
  <defs>
    <linearGradient id="ink-weknora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c3030"/><stop offset="1" stop-color="#10161d"/></linearGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#fff1ba"/><stop offset=".53" stop-color="#f3c66e"/><stop offset="1" stop-color="#d79b48"/></linearGradient>
    <path id="star" d="m8 .8 2.05 4.34 4.76 .64-3.48 3.36 .85 4.82L8 11.6 3.82 13.96l.85-4.82L1.2 5.78l4.75-.64z"/>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#adbbc0"/></pattern>
  </defs>
  <rect x=".6" y=".6" width="272.8" height="206.8" rx="10" fill="url(#ink-weknora)" stroke="#47525d" stroke-width="1.2"/>
  <path d="M15 35h244" stroke="#48515e" opacity=".62"/>
  <rect x="15" y="39" width="244" height="77" fill="url(#dots)" opacity=".21"/>
  <text x="15" y="25" fill="#f0f3f2" font-size="17.5" font-weight="650">WeKnora</text>
  <rect x="192" y="8.5" width="67" height="21" rx="10.5" fill="#292920" stroke="#826b43" stroke-opacity=".65"/>
  <use href="#star" transform="translate(198 12) scale(.82)" fill="url(#gilt)"/>
  <text x="253" y="23.5" text-anchor="end" class="stars" fill="#fbe4a6"><!--stars:Tencent/WeKnora-->38.2k<!--/stars--></text>
  <g aria-hidden="true">
    <text x="18" y="52" class="micro" fill="#c8e6db">Quantity</text>
