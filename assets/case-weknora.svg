<rect x="178" y="46" width="65" height="20" rx="3" fill="none" stroke="#9ce7ce" stroke-width="1.4" class="signal" style="--phase:0s"/><rect x="178" y="73" width="65" height="20" rx="3" fill="none" stroke="#9ce7ce" stroke-width="1.4" class="signal" style="--phase:1.0s"/></g>
    <path d="M15 105h244" stroke="#47515b" opacity=".69"/>
    <text x="15" y="126" fill="#eef2ef" font-size="16" font-weight="610">Keep all four PDF quantities</text>
    <text x="15" y="145" font-size="15.5" fill="#cedad6" class="decision">124 · 237 · 68 · 91</text>
    <text x="15" y="162" font-size="15.5" fill="#cedad6" class="decision">Use layout to filter page labels.</text>
    <text x="15" y="181" class="ticket" fill="#9fdbc4">PDF extraction</text>
    <text x="259" y="181" text-anchor="end" class="ticket" fill="#d2d9da">#3228 ↗</text>
