    </g>
    <g class="val" fill="#c4f5d7" text-anchor="middle">
      <text x="183.5" y="77">124</text><text x="233.5" y="77">237</text>
      <text x="183.5" y="103">68</text><text x="233.5" y="103">91</text>
    </g>
    <g fill="none" stroke="#a4eccb" stroke-width="1.5">
      <rect class="signal" style="--phase:0s" x="162" y="60" width="43" height="23" rx="3"/>
      <rect class="signal" style="--phase:.14s" x="212" y="60" width="43" height="23" rx="3"/>
      <rect class="signal" style="--phase:.28s" x="162" y="86" width="43" height="23" rx="3"/>
      <rect class="signal" style="--phase:.42s" x="212" y="86" width="43" height="23" rx="3"/>
    </g>
  </g>
  <path d="M15 123h244" stroke="#47515b" opacity=".69"/>
  <text x="15" y="144" fill="#eef2ef" font-size="16" font-weight="610">Keep all four PDF quantities</text>
  <text x="15" y="163" font-size="15.5" fill="#cedad6">Use layout to identify page</text>
  <text x="15" y="180" font-size="15.5" fill="#cedad6">numbers and chart labels.</text>
  <text x="15" y="199" class="ticket" fill="#9fdbc4">PDF extraction</text>
  <text x="259" y="199" text-anchor="end" class="ticket" fill="#d2d9da">#3228 ↗</text>
</svg>
