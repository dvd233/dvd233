  <g fill="#d8eee6" class="val"><text x="73" y="72">124</text><text x="73" y="90">237</text></g>
  <path d="M28 67h27M28 85h19" stroke="#708d8c" stroke-width="2"/>
  <path d="M110 68h32l12-12h21M142 68l12 15h21" fill="none" stroke="#62ab9e" stroke-width="1.7"/>
  <rect x="178" y="46" width="65" height="20" rx="3" fill="#193531" stroke="#4d8071"/>
  <rect x="178" y="73" width="65" height="20" rx="3" fill="#193531" stroke="#4d8071"/>
  <g class="val" fill="#c4f5d7"><text x="190" y="60">124</text><text x="190" y="87">237</text></g>
