  <rect x="1" y="1" width="958" height="558" rx="22" fill="#0D141B" stroke="#2B3947" stroke-width="2"/>
  <rect x="2" y="2" width="956" height="556" rx="21" fill="url(#grid)" opacity=".56"/>
  <text x="42" y="44" fill="#8ED5FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">CORE STACK</text>
  <text x="42" y="76" fill="#B9C7D5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">A practical toolchain from product interface to spectral imaging</text>
  <line x1="42" y1="94" x2="918" y2="94" stroke="#263440" stroke-width="2"/>
  <line x1="42" y1="94" x2="450" y2="94" stroke="url(#spectrum)" stroke-width="2"/>

  <g>
    <rect x="42" y="120" width="420" height="180" rx="18" fill="#121D26" stroke="#2B3B48"/>
    <text x="66" y="157" fill="#F4F7FA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700">Interface</text>
    <text x="66" y="181" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">product surfaces and interaction</text>
    <use href="#react" x="66" y="198" width="36" height="36"/><text x="112" y="223" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">React</text>
    <use href="#typescript" x="260" y="198" width="36" height="36"/><text x="306" y="223" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">TypeScript</text>
    <use href="#vite" x="66" y="246" width="36" height="36"/><text x="112" y="271" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">Vite</text>
    <use href="#flow" x="260" y="246" width="36" height="36"/><text x="306" y="271" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">React Flow</text>
  </g>

  <g>
    <rect x="498" y="120" width="420" height="180" rx="18" fill="#121D26" stroke="#2B3B48"/>
    <text x="522" y="157" fill="#F4F7FA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700">AI systems</text>
    <text x="522" y="181" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">models, graphs, and tool calls</text>
    <use href="#python" x="522" y="198" width="36" height="36"/><text x="568" y="223" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">Python</text>
    <use href="#pytorch" x="716" y="198" width="36" height="36"/><text x="762" y="223" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">PyTorch</text>
    <use href="#langgraph" x="522" y="246" width="36" height="36"/><text x="568" y="271" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">LangGraph</text>
    <use href="#mcp" x="716" y="246" width="36" height="36"/><text x="762" y="271" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">MCP</text>
  </g>

  <g>
    <rect x="42" y="324" width="420" height="180" rx="18" fill="#121D26" stroke="#2B3B48"/>
    <text x="66" y="361" fill="#F4F7FA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700">Backend + data</text>
    <text x="66" y="385" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">APIs, state, and persistence</text>
    <use href="#node" x="66" y="402" width="36" height="36"/><text x="112" y="427" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">Node.js</text>
    <use href="#nest" x="260" y="402" width="36" height="36"/><text x="306" y="427" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">NestJS</text>
    <use href="#postgres" x="66" y="450" width="36" height="36"/><text x="112" y="475" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">PostgreSQL</text>
    <use href="#redis" x="260" y="450" width="36" height="36"/><text x="306" y="475" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">Redis</text>
  </g>

  <g>
    <rect x="498" y="324" width="420" height="180" rx="18" fill="#121D26" stroke="#2B3B48"/>
    <text x="522" y="361" fill="#F4F7FA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700">Client delivery</text>
    <text x="522" y="385" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">desktop, source control, and streams</text>
    <use href="#rust" x="522" y="402" width="36" height="36"/><text x="568" y="427" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">Rust</text>
    <use href="#tauri" x="716" y="402" width="36" height="36"/><text x="762" y="427" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">Tauri</text>
    <use href="#git" x="522" y="450" width="36" height="36"/><text x="568" y="475" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">Git</text>
    <use href="#network" x="690" y="450" width="36" height="36"/><text x="736" y="475" fill="#C8D7E2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">SSE / WebSocket</text>
  </g>
  <text x="42" y="538" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">HTML5 / CSS3 / JavaScript / Zustand / Webpack / Rspack / LangChain / pgvector / RBAC / diff and rollback / 400-700 nm</text>
</svg>
