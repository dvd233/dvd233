<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Spectral trace footer</title>
  <desc id="desc">An authored spectral trace over an engineering grid for dvd's profile footer, with a visible-spectrum axis from 400 to 700 nanometres.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B2934" stroke-width="1" opacity=".62"/>
    </pattern>
    <linearGradient id="spectrum" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7B2CBF"/>
      <stop offset=".18" stop-color="#4C8DFF"/>
      <stop offset=".42" stop-color="#55D9C0"/>
      <stop offset=".68" stop-color="#F0D26B"/>
      <stop offset="1" stop-color="#C84A4A"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#A87BDE"/>
      <stop offset=".42" stop-color="#8FE8D2"/>
      <stop offset="1" stop-color="#F3B36C"/>
    </linearGradient>
    <filter id="soft-trace" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="958" height="318" rx="22" fill="#0B1219" stroke="#2B3947" stroke-width="2"/>
  <rect x="2" y="2" width="956" height="316" rx="21" fill="url(#grid)" opacity=".64"/>

  <text x="42" y="43" fill="#8ED5FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.2">SPECTRAL TRACE</text>
  <text x="42" y="78" fill="#F4F7FA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="25" font-weight="700">KEEP BUILDING / KEEP SHIPPING</text>

  <path d="M78 212 C132 252 201 246 250 198 S344 132 411 178 S512 246 584 201 S671 118 747 148 S819 191 872 120" fill="none" stroke="#71D6BD" stroke-width="19" stroke-linecap="round" opacity=".2" filter="url(#soft-trace)"/>
  <path d="M78 212 C132 252 201 246 250 198 S344 132 411 178 S512 246 584 201 S671 118 747 148 S819 191 872 120" fill="none" stroke="url(#trace)" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(872 120)">
    <circle r="15" fill="#0B1219" stroke="#D8F5E6" stroke-width="3"/>
    <circle cx="-5" cy="-3" r="2.2" fill="#D8F5E6"/>
    <circle cx="5" cy="-3" r="2.2" fill="#D8F5E6"/>
    <path d="M-5 5c3 3 7 3 10 0" fill="none" stroke="#D8F5E6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <rect x="78" y="276" width="794" height="8" rx="4" fill="url(#spectrum)"/>
  <g stroke="#8998A7" stroke-width="1.5">
    <path d="M78 267v26M343 267v26M608 267v26M872 267v26"/>
  </g>
  <g fill="#8998A7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">
    <text x="78" y="310">400 nm</text>
    <text x="343" y="310" text-anchor="middle">500</text>
    <text x="608" y="310" text-anchor="middle">600</text>
    <text x="872" y="310" text-anchor="end">700 nm</text>
  </g>
</svg>
