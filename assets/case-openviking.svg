<svg xmlns="http://www.w3.org/2000/svg" id="motion" width="280" height="208" viewBox="-3 0 280 208" role="img" aria-labelledby="title desc">
  <title id="title">OpenViking · Session replay · PR 5318</title>
  <desc id="desc">The DeepSeek Harness plugin writes new memory with the plugin:openviking-memory tag. During replay it recognizes either this tag or the legacy tag on older messages. This merged PR was AI-generated. Stars belong to the upstream repository.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .mono { font-family: ui-monospace, Consolas, 'Liberation Mono', monospace; }
    .pass {
      fill: none;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-dasharray: 13 100;
      stroke-dashoffset: 13;
      opacity: 0;
    }
    #motion:target .pass { animation: read-tag 6s ease-in-out infinite; }
    #motion:target .current { animation-delay: 1.4s; }
    @keyframes read-tag {
      0%, 7% { opacity: 0; stroke-dashoffset: 13; }
      11% { opacity: .95; }
      23% { opacity: .95; }
      27%, 100% { opacity: 0; stroke-dashoffset: -100; }
    }
  </style>
