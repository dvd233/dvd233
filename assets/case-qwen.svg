<svg xmlns="http://www.w3.org/2000/svg" id="motion" width="280" height="208" viewBox="-3 0 280 208" role="img" aria-labelledby="title desc">
  <title id="title">QwenLM/qwen-code #11300</title>
  <desc id="desc">Qwen Code keeps hook-created commits on rollback. Delete the newly created branch only if its tip still matches the starting commit. Merged PR 11300. The star count belongs to the upstream repository.</desc>
  <style>
    text { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; }
    .micro,.val,.ticket,.stars {font-family:ui-monospace,Consolas,'Liberation Mono',monospace}
    .micro {font-size:11.5px}.val {font-size:12.5px}.ticket {font-size:13px}.stars {font-size:12px;font-weight:600}

    .hook-highlight,.ref-trace,.ref-highlight {opacity:0}
    #motion:target .hook-highlight {animation:hook-arrives 6s ease-out infinite}
    #motion:target .ref-trace {stroke-dasharray:13 110;animation:trace-ref 6s linear infinite}
    #motion:target .ref-highlight {animation:ref-retained 6s ease-out infinite}
    @keyframes hook-arrives {
      0%,12%,38%,100% {opacity:0}
      20%,24% {opacity:.85}
    }
    @keyframes trace-ref {
      0%,21% {opacity:0;stroke-dashoffset:14}
      23% {opacity:.92;stroke-dashoffset:9}
      41% {opacity:.92;stroke-dashoffset:-85}
      46%,100% {opacity:0;stroke-dashoffset:-101}
    }
    @keyframes ref-retained {
      0%,38%,73%,100% {opacity:0}
      46%,55% {opacity:.86}
    }
  </style>
  <defs>
    <linearGradient id="ink-qwen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#262537"/><stop offset="1" stop-color="#10161d"/></linearGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#fff1ba"/><stop offset=".53" stop-color="#f3c66e"/><stop offset="1" stop-color="#d79b48"/></linearGradient>
    <path id="star" d="m8 .8 2.05 4.34 4.76 .64-3.48 3.36 .85 4.82L8 11.6 3.82 13.96l.85-4.82L1.2 5.78l4.75-.64z"/>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#adbbc0"/></pattern>
  </defs>
  <g>
    <rect x=".6" y=".6" width="272.8" height="206.8" rx="10" fill="url(#ink-qwen)" stroke="#47525d" stroke-width="1.2"/>
    <path d="M15 35h244" stroke="#48515e" opacity=".62"/>
    <rect x="15" y="39" width="244" height="77" fill="url(#dots)" opacity=".21"/>
    <text x="15" y="25" fill="#f0f3f2" font-size="17.5" font-weight="650">Qwen Code</text>
    <rect x="192" y="8.5" width="67" height="21" rx="10.5" fill="#292920" stroke="#826b43" stroke-opacity=".65"/>
    <use href="#star" transform="translate(198 12) scale(.82)" fill="url(#gilt)"/>
    <text x="253" y="23.5" text-anchor="end" class="stars" fill="#fbe4a6"><!--stars:QwenLM/qwen-code-->31.0k<!--/stars--></text>
    <g aria-hidden="true">
      <path d="M18 88H96" fill="none" stroke="#76738c" stroke-width="2"/>
      <path d="M49 88C78 88 78 66 105 66H127" fill="none" stroke="#b5a6ff" stroke-width="2.7"/>
      <circle cx="49" cy="88" r="5" fill="#282737" stroke="#c2bbd7" stroke-width="1.7"/>
      <text x="25" y="111" class="val" fill="#d2cddd">start</text>

      <text x="92" y="50" class="val" fill="#e0d8ff">hook commit</text>
      <path d="M131 66H175" stroke="#8d81b7" stroke-width="2"/>
      <path d="M131 66H175" pathLength="100" class="ref-trace" stroke="#eee8ff" stroke-linecap="round" stroke-width="3.2"/>
      <circle cx="127" cy="66" r="5.4" fill="#bbb0fb" stroke="#e5ddff" stroke-width="1.4"/>
      <circle cx="127" cy="66" r="10" class="hook-highlight" fill="none" stroke="#dacbff" stroke-width="1.5"/>

      <rect x="176" y="55" width="82" height="22" rx="5" fill="#353249" stroke="#a59ac7"/>
      <path d="m182 66 3 3 5-6" fill="none" stroke="#e2f0cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="252" y="70" text-anchor="end" class="micro" fill="#f2edff">tip kept</text>
      <rect x="173.5" y="52.5" width="87" height="27" rx="7" class="ref-highlight" fill="none" stroke="#d6c9ff" stroke-width="1.3"/>
      <text x="110" y="105" class="micro" fill="#c5c1d1">post-checkout exits 1</text>
    </g>
    <path d="M15 123h244" stroke="#47515b" opacity=".69"/>
    <text x="15" y="144" fill="#eef2ef" font-size="16" font-weight="610">Keep hook-created commits</text>
    <text x="15" y="163" font-size="15.5" fill="#cedad6">Moved tip → keep branch</text>
    <text x="15" y="180" font-size="15.5" fill="#cedad6">Unchanged tip → delete branch</text>
    <text x="15" y="199" class="ticket" fill="#b7a6ff">Git rollback</text>
    <text x="259" y="199" text-anchor="end" class="ticket" fill="#d2d9da">#11300 ↗</text>
  </g>
  </svg>
