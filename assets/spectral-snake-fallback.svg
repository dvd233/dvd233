<svg xmlns="http://www.w3.org/2000/svg" width="880" height="192" viewBox="0 0 880 192" role="img" aria-labelledby="title desc">
  <title id="title">Spectral contribution snake fallback</title>
  <desc id="desc">A static local fallback for the generated GitHub contribution snake. The live output-branch SVG is selected on GitHub.</desc>
  <defs>
    <pattern id="cells" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" rx="2" fill="#1B2934"/>
    </pattern>
    <linearGradient id="trace" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7B2CBF"/>
      <stop offset=".36" stop-color="#4C8DFF"/>
      <stop offset=".62" stop-color="#55D9C0"/>
      <stop offset="1" stop-color="#F3B36C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="878" height="190" rx="20" fill="#0D141B" stroke="#2B3947" stroke-width="2"/>
  <text x="32" y="31" fill="#8ED5FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">CONTRIBUTION SNAKE</text>
  <text x="848" y="31" text-anchor="end" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">LIVE SVG ON OUTPUT BRANCH</text>
  <rect x="68" y="50" width="742" height="98" rx="8" fill="url(#cells)"/>

  <g fill="#2B4A55">
    <rect x="110" y="92" width="11" height="11" rx="2"/><rect x="152" y="120" width="11" height="11" rx="2"/>
    <rect x="222" y="64" width="11" height="11" rx="2"/><rect x="278" y="106" width="11" height="11" rx="2"/>
    <rect x="348" y="78" width="11" height="11" rx="2"/><rect x="418" y="120" width="11" height="11" rx="2"/>
    <rect x="488" y="64" width="11" height="11" rx="2"/><rect x="558" y="92" width="11" height="11" rx="2"/>
    <rect x="628" y="120" width="11" height="11" rx="2"/><rect x="698" y="78" width="11" height="11" rx="2"/>
  </g>
  <path d="M88 134H158V106H228V78H298V120H368V92H438V64H508V106H578V78H648V120H718V92H788" fill="none" stroke="#55D9C0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".32" filter="url(#glow)"/>
  <path d="M88 134H158V106H228V78H298V120H368V92H438V64H508V106H578V78H648V120H718V92H788" fill="none" stroke="url(#trace)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="788" cy="92" r="7" fill="#F3B36C" stroke="#F8E0B6" stroke-width="2"/>
  <text x="68" y="174" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">LOCAL FALLBACK / NOT CONTRIBUTION DATA</text>
</svg>
