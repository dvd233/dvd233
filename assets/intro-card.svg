<svg xmlns="http://www.w3.org/2000/svg" width="960" height="288" viewBox="0 0 960 288" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm dvd. AI Full-Stack Engineer.</title>
  <desc id="desc">A centered graphite identity card for dvd. A visible-spectrum wavelength axis from 400 to 700 nanometres and a spectral trace frame the AI Full-Stack Engineer title.</desc>
  <defs>
    <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B2934" stroke-width="1" opacity=".62"/>
    </pattern>
    <linearGradient id="spectral-band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7B2CBF"/>
      <stop offset=".18" stop-color="#4C8DFF"/>
      <stop offset=".42" stop-color="#55D9C0"/>
      <stop offset=".68" stop-color="#F0D26B"/>
      <stop offset="1" stop-color="#C84A4A"/>
    </linearGradient>
    <linearGradient id="spectral-trace" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9E70D8"/>
      <stop offset=".45" stop-color="#8FE8D2"/>
      <stop offset="1" stop-color="#F3B36C"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="958" height="286" rx="22" fill="#0D141B" stroke="#2B3947" stroke-width="2"/>
  <rect x="2" y="2" width="956" height="284" rx="21" fill="url(#micro-grid)" opacity=".48"/>

  <text x="480" y="42" text-anchor="middle" fill="#8EA1B1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2.4">DVD / AI APPLICATIONS</text>
  <text x="480" y="108" text-anchor="middle" fill="#F4F7FA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="36" font-weight="700">Hi, I'm <tspan fill="#A9EBD4">dvd</tspan>.</text>
  <text x="480" y="155" text-anchor="middle" fill="#8ED5FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="29" font-weight="700">AI Full-Stack Engineer</text>
  <text x="480" y="181" text-anchor="middle" fill="#9AA8B6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="1.25">AI APPLICATIONS / FRONTEND / CLIENTS / IMAGING</text>

  <text x="126" y="204" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.8">SPECTRAL SIGNATURE</text>
  <text x="834" y="204" text-anchor="end" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.8">VISIBLE RANGE</text>
  <rect x="126" y="212" width="708" height="8" rx="4" fill="url(#spectral-band)"/>
  <path d="M126 242 C176 228 214 234 254 241 S334 251 382 232 S462 218 512 239 S594 252 640 232 S724 218 772 231 S812 240 834 226" fill="none" stroke="url(#spectral-trace)" stroke-width="3" stroke-linecap="round"/>

  <g fill="#8998A7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
    <path d="M126 224v8M244 224v8M362 224v8M480 224v8M598 224v8M716 224v8M834 224v8" stroke="#8998A7" stroke-width="1.5"/>
    <text x="126" y="272">400 nm</text>
    <text x="244" y="272" text-anchor="middle">450</text>
    <text x="362" y="272" text-anchor="middle">500</text>
    <text x="480" y="272" text-anchor="middle">550</text>
    <text x="598" y="272" text-anchor="middle">600</text>
    <text x="716" y="272" text-anchor="middle">650</text>
    <text x="834" y="272" text-anchor="end">700 nm</text>
  </g>
</svg>
