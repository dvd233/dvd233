<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages status</title>
  <desc id="desc">A dated direct GitHub API check for dvd233's three owned repositories. No language byte counts were returned, so no percentage ranking is shown.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B2934" stroke-width="1" opacity=".62"/>
    </pattern>
    <linearGradient id="spectrum" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7B2CBF"/>
      <stop offset=".18" stop-color="#4C8DFF"/>
      <stop offset=".42" stop-color="#55D9C0"/>
      <stop offset=".68" stop-color="#F0D26B"/>
      <stop offset="1" stop-color="#C84A4A"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8ED5FF"/>
      <stop offset=".5" stop-color="#A9EBD4"/>
      <stop offset="1" stop-color="#F3B36C"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="958" height="328" rx="22" fill="#0D141B" stroke="#2B3947" stroke-width="2"/>
  <rect x="2" y="2" width="956" height="326" rx="21" fill="url(#grid)" opacity=".55"/>

  <text x="42" y="43" fill="#8ED5FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">MOST USED LANGUAGES</text>
  <text x="918" y="43" text-anchor="end" fill="#8293A2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing=".7">DIRECT API CHECK / 28 AUG 2026</text>
  <line x1="42" y1="65" x2="918" y2="65" stroke="#263440" stroke-width="2"/>
  <line x1="42" y1="65" x2="310" y2="65" stroke="url(#spectrum)" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <circle cx="72" cy="116" r="12" fill="#182731" stroke="#55D9C0" stroke-width="2"/>
    <path d="M67 116l4 4 7-8" fill="none" stroke="#A9EBD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="123" fill="#F4F7FA" font-size="25" font-weight="700">NO LANGUAGE RANKING YET</text>
    <text x="42" y="163" fill="#B7C4CE" font-size="16">GitHub returned no byte counts for dvd233's three owned repositories.</text>
    <text x="42" y="190" fill="#8293A2" font-size="15">There is no honest percentage split to plot until source bytes are available.</text>

    <rect x="676" y="92" width="242" height="126" rx="16" fill="#121D26" stroke="#2B3B48"/>
    <text x="698" y="119" fill="#8293A2" font-size="12" font-weight="700" letter-spacing="1.5">CHECK RESULT</text>
    <text x="698" y="164" fill="url(#signal)" font-size="38" font-weight="700">3 / 3</text>
    <text x="698" y="190" fill="#9AA8B6" font-size="14">owned repos scanned</text>

    <line x1="42" y1="239" x2="918" y2="239" stroke="#263440" stroke-width="1.5"/>
    <text x="42" y="265" fill="#8293A2" font-size="12" font-weight="700" letter-spacing="1.5">SOURCE</text>
    <text x="42" y="288" fill="#F4F7FA" font-size="15">GitHub repository language API</text>
    <text x="918" y="265" text-anchor="end" fill="#8293A2" font-size="12" font-weight="700" letter-spacing="1.5">RESULT</text>
    <text x="918" y="288" text-anchor="end" fill="#F4F7FA" font-size="15">0 byte counts returned</text>
  </g>

  <rect x="42" y="306" width="876" height="6" rx="3" fill="url(#spectrum)" opacity=".86"/>
</svg>
