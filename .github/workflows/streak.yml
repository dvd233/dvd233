name: Refresh streak cards

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dual-theme streak SVGs with retry
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl -sfL --max-time 30 "$url" > "$out.raw" 2>/dev/null; then
                sed -n '/<svg/,$p' "$out.raw" > "$out.tmp"
                if head -1 "$out.tmp" | grep -q '^<svg' \
                  && grep -Eq 'Current Streak|Total Contributions' "$out.tmp"; then
                  mv "$out.tmp" "$out"
                  rm -f "$out.raw"
                  echo "updated $out ($(wc -c < "$out") bytes)"
                  return 0
                fi
              fi
              rm -f "$out.raw" "$out.tmp"
              sleep 10
            done
            echo "keeping previous $out (source unavailable)"
          }
          fetch "https://streak-stats.demolab.com?user=dvd233&hide_border=true&background=00000000&ring=7B2CBF&fire=C84A4A&currStreakLabel=1D3541&sideLabels=345D68&dates=345D68" assets/streak-light.svg
          fetch "https://streak-stats.demolab.com?user=dvd233&hide_border=true&background=00000000&ring=F3B36C&fire=F3B36C&currStreakNum=E7EEF2&sideNums=E7EEF2&currStreakLabel=B8C8D0&sideLabels=B8C8D0&dates=8FA8B5" assets/streak-dark.svg

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain assets/streak-light.svg assets/streak-dark.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/streak-light.svg assets/streak-dark.svg
            git commit -m "chore(profile): refresh streak cards"
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              sleep 5
            done
            exit 1
          else
            echo "streak cards unchanged"
          fi
