name: Refresh trophy cards

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  trophy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dual-theme trophy SVGs with retry
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl -sfL --max-time 30 "$url" > "$out.tmp" 2>/dev/null \
                && grep -q '<svg' "$out.tmp" && grep -q '</svg>' "$out.tmp"; then
                mv "$out.tmp" "$out"
                echo "updated $out ($(wc -c < "$out") bytes)"
                return 0
              fi
              rm -f "$out.tmp"
              sleep 10
            done
            echo "keeping previous $out (source unavailable)"
          }
          fetch "https://github-profile-trophy-pied-two.vercel.app/?username=dvd233&theme=flat&no-bg=true&no-frame=true&column=7&margin-w=8&rank=SECRET,SSS,SS,S,AAA,AA,A,B,C" assets/trophy-light.svg
          fetch "https://github-profile-trophy-pied-two.vercel.app/?username=dvd233&theme=onedark&no-bg=true&no-frame=true&column=7&margin-w=8&rank=SECRET,SSS,SS,S,AAA,AA,A,B,C" assets/trophy-dark.svg

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain assets/trophy-light.svg assets/trophy-dark.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/trophy-light.svg assets/trophy-dark.svg
            git commit -m "chore(profile): refresh trophy cards"
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              sleep 5
            done
            exit 1
          else
            echo "trophies unchanged"
          fi
